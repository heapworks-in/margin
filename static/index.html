<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Margin</title>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<script src="vendor/editor.js?v=45"></script>
<style>
:root{
  color-scheme:dark;
  --canvas:#0E1117; --paper:#0E1117; --panel:#151A22; --hover:#1C222C; --raise:#242B37;
  --line:#232A35; --line-strong:#313A48;
  --ink:#E6E9EE; --ink-2:#C2C8D2; --muted:#8A93A3; --faint:#5C6573;
  --accent:#5B9CFF; --accent-ink:#8FBCFF; --accent-soft:#16283F;
  --green:#48D597;
  --english:#6AA6FF; --missing:#F2B64B; --fact:#FF7B86; --question:#4ECBA9; --structure:#9AA1AC; --draft:#4C8DFF;
  --english-bg:#1D2E4A; --missing-bg:#3A2F12; --fact-bg:#3F1F27; --question-bg:#143A33; --structure-bg:#2A2E35; --reader:#F5B8D0; --reader-bg:#3A2430;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:13.5px/1.5 var(--ui);font-feature-settings:"ss01","cv11";display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::selection{background:#3D4C8A}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3A3F48;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- header ---------- */
.bar{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 86px;background:var(--paper);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);display:inline-block}
.crumb{color:var(--faint);margin:0 2px}
.pick{position:relative}
.pick select{appearance:none;background:none;border:1px solid transparent;border-radius:6px;padding:4px 22px 4px 6px;color:var(--ink-2)}
.pick select:hover{background:var(--hover)}
.pick::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.views{display:flex;gap:2px;margin-left:10px;background:var(--hover);border-radius:7px;padding:2px}
.views button{background:none;border:0;border-radius:5px;padding:3px 10px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.views button .n{color:var(--faint);margin-left:5px}
.spacer{flex:1;align-self:stretch}
.saved{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:12.5px;opacity:0;transition:opacity .4s}
.saved.show{opacity:1}
.meta{color:var(--muted);font-size:12.5px;margin:0 6px}
.tool{background:none;border:0;border-radius:6px;padding:5px 9px;color:var(--ink-2);list-style:none;cursor:pointer}
.tool:hover{background:var(--hover)}
.tool.danger{color:var(--fact)}
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:7px;padding:5px 11px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B1326}
.btn.primary:hover{background:var(--accent-ink)}
.dd{position:relative}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:" ▾";color:var(--muted);font-size:11px}
.dd[open] summary{background:var(--hover)}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);min-width:220px;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:4px;box-shadow:0 12px 32px -10px #000c;z-index:60;display:flex;flex-direction:column}
.dd-menu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;color:var(--ink)}
.dd-menu button:hover{background:var(--hover)}

/* ---------- layout ---------- */
.app{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.app.focus .toc,.app.focus .dock,.app.focus .status,.app.in-library .toc,.app.in-library .dock,.app.in-library .status{display:none}
.app.in-library~* .views{visibility:hidden}
.app.focus .sheet-wrap{padding-bottom:120px}

/* ---------- section spine (floating, left margin) ---------- */
.toc{position:absolute;left:16px;top:28px;z-index:6;padding:8px 6px;border:1px solid transparent;border-radius:10px;transition:background .15s,border-color .15s,box-shadow .15s}
.toc:hover{background:var(--panel);border-color:var(--line-strong);box-shadow:0 14px 36px -14px #000;padding:8px}
.toc-item{display:flex;align-items:center;gap:10px;height:14px;width:100%;background:none;border:0;padding:0 4px;color:var(--muted);border-radius:6px;text-align:left;transition:height .15s}
.toc-item .tick{width:16px;height:2px;border-radius:2px;background:#30343C;flex:none;transition:background .15s,width .15s}
.toc-item.missing .tick{background:repeating-linear-gradient(90deg,#4A4F58 0 3px,transparent 3px 6px)}
.toc-item.filled .tick{background:#8B919C}
.toc-item.on .tick{background:var(--accent);width:22px;height:3px}
.toc-item.notes .tick{width:8px;margin-right:8px}
.toc-item .label,.toc-item .count,.toc-foot{display:none}
.toc:hover .toc-item{height:28px}
.toc:hover .toc-item:hover{background:var(--hover);color:var(--ink)}
.toc:hover .toc-item.on{color:var(--ink)}
.toc:hover .toc-item.missing{color:var(--faint)}
.toc:hover .toc-item .label{display:block;font-size:13px;white-space:nowrap}
.toc:hover .toc-item .count{display:block;margin-left:auto;padding-left:18px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.toc-foot{border-top:1px solid var(--line);margin-top:6px;padding:8px 4px 2px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.toc:hover .toc-foot{display:block}

/* ---------- coach dock (bottom) ---------- */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:42px;width:min(900px,calc(100% - 48px));z-index:8;display:flex;flex-direction:column;gap:8px}
.thread{display:flex;flex-direction:column;max-height:44vh;background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 18px 48px -20px #000}
.thread[hidden]{display:none}
.thread-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.coach-name{font-weight:700;color:var(--accent-ink)}
.dock-line{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-line b{color:var(--ink);font-weight:600}
.dock.busy .coach-name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:7px;animation:blink 1.1s infinite}
.log{flex:1;min-height:0;overflow:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px}
.msg.user{align-self:flex-end;max-width:80%;background:var(--accent-soft);color:#CFE0FF;padding:6px 10px;border-radius:10px 10px 3px 10px;white-space:pre-wrap;font-size:12.5px}
.msg.assistant{display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:13px;max-width:70ch}
.md p{margin:0 0 6px}.md p:last-child{margin:0}
.md ul,.md ol{margin:0 0 6px;padding-left:18px}
.md li{margin:2px 0}
.md b{color:var(--ink);font-weight:600}
.md h4{margin:4px 0;font-size:13px;color:var(--ink)}
.md code{background:var(--hover);padding:1px 5px;border-radius:4px;font-size:12px;font-family:var(--mono)}
.added{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px;width:max-content;border:0;cursor:pointer}
.welcome{color:var(--muted);font-size:12.5px;line-height:1.5}
.welcome b{color:var(--ink);font-weight:500}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.3;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{40%{opacity:1}}
.pending{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.ask{background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 48px -20px #000;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.ask-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modes{display:flex;gap:2px;background:var(--canvas);border-radius:7px;padding:2px}
.modes button{border:0;background:none;border-radius:5px;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:5px}
.actions button{background:none;border:1px solid var(--line-strong);color:var(--ink-2);font-size:12px;padding:3px 9px;border-radius:999px}
.actions button:hover{background:var(--hover)}
#thread-show{margin-left:auto}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--canvas);border:1px solid var(--line-strong);border-radius:10px;padding:5px 5px 5px 12px}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;resize:none;border:0;outline:none;background:none;color:var(--ink);padding:5px 0;max-height:140px;line-height:1.45;font-size:13.5px}
.composer textarea::placeholder{color:var(--faint)}
.send{flex:none;width:30px;height:30px;border-radius:7px;border:0;background:var(--accent);color:#0B1326;display:grid;place-items:center}
.send:hover{background:var(--accent-ink)}

/* ---------- library ---------- */
.brand{border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer}
.brand:hover{background:var(--hover)}
.library{width:100%}
.library[hidden]{display:none}
.lib-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.lib-head h1{font:700 32px/1.2 var(--ui);letter-spacing:-.02em;margin:0}
.lib-folder{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.lib-folder code{font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--panel);padding:2px 7px;border-radius:5px}
.lib-folder button,.lib-folder label{background:none;border:0;color:var(--accent-ink);font:inherit;cursor:pointer;padding:0}
.lib-folder input{background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;color:var(--ink);font:12.5px var(--mono);padding:4px 8px;min-width:360px}
.lib-new{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 28px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.lib-new input{flex:1;min-width:240px;background:var(--canvas);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);font:14px var(--ui);padding:8px 12px;outline:none}
.lib-new input:focus{border-color:var(--accent)}
.lib-new select{appearance:none;background:var(--canvas);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);padding:8px 30px 8px 12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.doc{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:132px;transition:border-color .15s}
.doc:hover{border-color:var(--line-strong)}
.doc .t{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.doc .k{font-size:12px;color:var(--muted)}
.doc .m{margin-top:auto;display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.doc .m b{color:var(--ink);font-weight:600}
.doc .ok{color:var(--green)}.doc .warn{color:var(--missing)}
.doc .x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--faint);font-size:14px;border-radius:5px;padding:2px 6px;opacity:0}
.doc:hover .x{opacity:1}
.doc .x:hover{color:var(--fact);background:var(--hover)}
.lib-empty{color:var(--muted);line-height:1.6}
/* images and diagrams in the text */
.ProseMirror img{max-width:100%;height:auto;border-radius:8px;display:block}
.ProseMirror img[data-scene]{cursor:pointer;background:#0B0E14;border:1px solid var(--line);padding:14px}
.ProseMirror img.ProseMirror-selectednode{outline:2px solid var(--accent);outline-offset:2px}
.dg-modal{position:fixed;inset:0;z-index:100;background:var(--canvas);display:flex;flex-direction:column}
.dg-bar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.dg-bar b{color:var(--ink)}
.dg-hint{flex:1;color:var(--muted);font-size:12.5px}
.dg-btn{border:1px solid var(--accent);background:var(--accent);color:#0B1326;border-radius:7px;padding:6px 12px;font:500 13px var(--ui);cursor:pointer}
.dg-btn.ghost{background:none;color:var(--ink-2);border-color:var(--line-strong)}
.dg-canvas{flex:1;min-height:0;position:relative}
.dg-canvas .excalidraw{height:100%}
/* fully local: no link out to the public library site */
.excalidraw .library-menu-browse-button,.excalidraw a[href*="libraries.excalidraw.com"],.excalidraw a[href*="excalidraw.com"]{display:none!important}

.ws-crumb{color:var(--ink-2);padding:4px 6px}
.lib-head{align-items:center}
.lib-head .path{color:var(--faint);font:12px var(--mono)}
.lib-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.lib-head select{appearance:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);padding:6px 28px 6px 10px;font-size:13px}
.lib-sec{margin:34px 0 0}
.lib-sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.lib-sec-head h2{font:700 20px/1.2 var(--ui);letter-spacing:-.015em;margin:0}
.lib-sec-head .n{color:var(--faint);font-size:12.5px}
.lib-sec-head .right{margin-left:auto;display:flex;gap:6px}
.lib-sec-head .btn{font-size:12.5px;padding:4px 10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.dcard .thumb{height:140px;background:#0B0E14;display:grid;place-items:center;padding:10px;border-bottom:1px solid var(--line)}
.dcard .thumb img{max-width:100%;max-height:100%}
.dcard .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dcard .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard .row{display:flex;gap:6px;flex-wrap:wrap}
.dcard .row button{background:none;border:1px solid var(--line-strong);color:var(--ink-2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.dcard .row button.primary{border-color:var(--accent);color:var(--accent-ink)}
.dcard .row button:hover{background:var(--hover)}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.frow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow small{color:var(--faint)}
.frow button{background:none;border:1px solid var(--line-strong);color:var(--ink-2);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.frow button:hover{background:var(--hover)}
.modal{position:fixed;inset:0;z-index:90;background:#0008;display:grid;place-items:center}
.modal[hidden]{display:none}
.modal .box{width:min(560px,calc(100% - 40px));background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 30px 80px -30px #000;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:700 20px/1.2 var(--ui);letter-spacing:-.015em}
.modal .tabs{display:flex;gap:2px;background:var(--canvas);border-radius:8px;padding:2px;width:max-content}
.modal .tabs button{border:0;background:none;border-radius:6px;padding:5px 12px;color:var(--muted);font-size:13px}
.modal .tabs button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.modal input[type=text],.modal input[type=email],.modal input[type=password],.modal select{background:var(--canvas);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);font:13.5px var(--ui);padding:8px 10px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .drop{border:1px dashed var(--line-strong);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
.modal .drop:hover,.modal .drop.over{border-color:var(--accent);color:var(--ink)}
.modal .drop input{display:none}
.modal .foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:4px}
.modal .err{color:var(--fact);font-size:12.5px;margin-right:auto}
.modal .note{font-size:12px;color:var(--faint);line-height:1.5}
.ctx-ws{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
.ctx-ws .frow{padding:5px 8px;font-size:12px;margin-top:4px}

.settings{max-width:720px}
.set-sec{margin:26px 0 0;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px}
.set-sec h2{margin:0;font:700 16px/1.3 var(--ui);letter-spacing:-.01em}
.set-sec p.note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.set-sec label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.set-sec label.row{flex-direction:row;align-items:center;gap:8px;color:var(--ink-2)}
.set-sec input[type=text],.set-sec select{background:var(--canvas);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);font:13.5px var(--ui);padding:8px 10px;outline:none}
.set-sec input[type=text]:focus{border-color:var(--accent)}
.set-sec code{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.set-foot{display:flex;gap:8px;align-items:center;margin-top:18px}
.set-foot .msg{color:var(--green);font-size:12.5px}
.set-foot .err{color:var(--fact);font-size:12.5px}
.app.in-library .views{visibility:hidden}

/* ---------- status bar (bottom, Word-style) ---------- */
.status{position:absolute;left:0;right:0;bottom:0;height:32px;z-index:9;display:flex;align-items:center;gap:0;padding:0 10px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
.status>*{padding:0 10px;border-right:1px solid var(--line);white-space:nowrap}
.status>*:last-child{border-right:0}
.status .right{margin-left:auto;border-right:0;display:flex;padding:0}
.status .right>*{padding:0 10px;border-left:1px solid var(--line)}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.status button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;border-radius:4px;padding:3px 8px}
.status button:hover{background:var(--hover);color:var(--ink)}
.status .ok{color:var(--green)}
.status .warn{color:var(--missing)}
.pop.lessons{width:360px}
.lesson-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.lesson{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;font-size:12.5px;color:var(--ink-2)}
.lesson b{font-variant-numeric:tabular-nums;color:var(--english);font-weight:700}
.lesson .r{color:var(--ink);font-weight:600}
.lesson small{grid-column:2;color:var(--muted);line-height:1.4}
.lessons-empty{font-size:12px;color:var(--faint);line-height:1.5}
.cards{display:flex;flex-direction:column;gap:8px}

/* ---------- document + comment rail ---------- */
.desk{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto}
.sheet-wrap{max-width:1240px;margin:0 auto;padding:48px 48px 300px 84px}
.page{width:100%;padding:0 0 120px 44px}
.page[hidden]{display:none}
.doc-title{display:block;font:700 39px/1.15 var(--ui);letter-spacing:-.025em;border:0;width:100%;outline:none;background:none;color:var(--ink);padding:0;margin:0 0 18px;resize:none;overflow:hidden}
.doc-title::placeholder{color:#4A4F58}
.doc-sub{display:none}

  <button type="button" class="tool" id="new">New</button>

</header>

<div class="pop" id="pop" hidden></div>
<div class="modal" id="import" hidden></div>
<main class="app">

        <section id="settings" class="library settings" hidden></section>

</main>

  'Skeptical VP': 'attacks the business case, cost, opportunity cost and the clarity of the ask; asks "What do I lose if I say no?"',

};
const RUBRIC = ['bottom line', 'evidence', 'options', 'risk honesty', 'audience fit', 'structure', 'economy', 'actionability'];
const DEFAULT_STYLE = `STYLE RULES
1. Active voice. Name the actor: "the service retries the call", not "the call is retried".
2. One idea per sentence. Sentences under 25 words. Paragraphs of three sentences or fewer.
3. Lead with the point. The first sentence of the document and of every section states the conclusion.
4. No filler: "it is important to note", "in order to", "basically", "leverage", "robust", "seamless", "various", "utilize".
5. No vision language: "north star", "world-class", "best-in-class", "transformational", "paradigm", "journey".
6. Numbers over adjectives: "p99 drops from 840 ms to 210 ms", not "much faster".
7. Headings are claims, not labels.
8. Tables for options and comparisons; diagrams for flows and architecture; prose for reasoning.
9. Define every acronym on first use, except the reader's daily vocabulary.
10. Say "we will" for decisions, "we propose" for asks, "we do not know" for unknowns.`;
const NOTES = 'Notes';
const LAST = 'docu-coach-last';
const inApp = !!window.__TAURI__;
const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
// Documents live on disk in the app (one folder each). In a plain browser (UI work) they live in localStorage.
const store = inApp ? {
  list: () => invoke('docs_list'),
  create: title => invoke('doc_create', { title }),
  load: id => invoke('doc_load', { id }).then(JSON.parse),
  save: (id, obj, markdown) => invoke('doc_save', { id, json: JSON.stringify(obj), markdown }),
  remove: id => invoke('doc_delete', { id }),
  ws: { info: () => invoke('ws_info'), use: (path, name) => invoke('ws_use', { path, name: name || null }), forget: path => invoke('ws_forget', { path }) },
  reveal: (id, sub) => invoke('reveal', { id: id || null, sub: sub || null }),
  asset: (id, name, data) => invoke('asset_save', { id, name, data }),
  diagrams: { list: () => invoke('diagrams_list'), save: (name, svg, scene) => invoke('diagram_save', { name, svg, scene }), load: name => invoke('diagram_load', { name }), remove: name => invoke('diagram_delete', { name }) },
  library: { load: () => invoke('library_load').then(JSON.parse), save: items => invoke('library_save', { json: JSON.stringify(items) }) },
  settings: { get: () => invoke('settings_get'), set: value => invoke('settings_set', { value }) },
  agents: () => invoke('agents_discover'),
  models: agentId => invoke('agent_models', { agentId: agentId || null }),
  style: { get: () => invoke('style_get'), set: text => invoke('style_set', { text }) },
  feedback: { get: () => invoke('feedback_get'), set: text => invoke('feedback_set', { text }) },
  history: { snapshot: (id, markdown, label) => invoke('doc_snapshot', { id, markdown, label }), list: id => invoke('history_list', { id }), read: (id, name) => invoke('history_read', { id, name }) },
  publish: (parentUrl, title, html, email, token, pageId) => invoke('confluence_publish', { parentUrl, title, html, email, token, pageId: pageId || null }),
  files: { list: () => invoke('files_list'), add: (name, data) => invoke('file_add', { name, data }), read: name => invoke('file_read', { name }), remove: name => invoke('file_delete', { name }) },
  confluence: (url, email, token) => invoke('confluence_fetch', { url, email, token }),
} : {
  _index: () => JSON.parse(localStorage.getItem('docu-coach-index') || '[]'),
  list: async function () { return this._index().map(id => { const d = JSON.parse(localStorage.getItem('docu-coach-doc:' + id) || '{}'); return { ...(d.meta || {}), id, title: d.title, templateId: d.templateId }; }).sort((a, b) => (b.updated || 0) - (a.updated || 0)); },
  create: async function (title) { const base = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'document'; let id = base, n = 2; const idx = this._index(); while (idx.includes(id)) id = `${base}-${n++}`; localStorage.setItem('docu-coach-index', JSON.stringify([...idx, id])); return id; },
  load: async id => { const t = localStorage.getItem('docu-coach-doc:' + id); if (!t) throw new Error('not found'); return JSON.parse(t); },
  save: async (id, obj) => localStorage.setItem('docu-coach-doc:' + id, JSON.stringify(obj)),
  remove: async function (id) { localStorage.removeItem('docu-coach-doc:' + id); localStorage.setItem('docu-coach-index', JSON.stringify(this._index().filter(x => x !== id))); },
  ws: { info: async () => { const name = localStorage.getItem('docu-coach-ws-name') || 'Browser workspace', path = localStorage.getItem('docu-coach-ws-name') ? '~/Documents/Margin' : 'browser storage'; return { path, name, workspaces: [{ path, name, exists: true }] }; }, use: async () => { throw new Error('Only in the app.'); }, forget: async () => {} },
  reveal: async () => {},
  asset: async (id, name) => name,
  diagrams: { _k: 'docu-coach-diagrams', list: async function () { return JSON.parse(localStorage.getItem(this._k) || '[]'); }, save: async function (name, svg, scene) { const l = (await this.list()).filter(d => d.name !== name); l.unshift({ name, svg, scene, updated: Date.now() }); localStorage.setItem(this._k, JSON.stringify(l)); return name; }, load: async function (name) { return (await this.list()).find(d => d.name === name); }, remove: async function (name) { localStorage.setItem(this._k, JSON.stringify((await this.list()).filter(d => d.name !== name))); } },

const blank = () => ({ id: null, title: '', templateId: 'design', notes: '', docJson: null, current: null, mode: 'review', chat: [], comments: [], checks: {}, audience: '', purpose: '', brief: { ask: '', objection: '', deadline: '', numbers: '', nongoals: '' }, rubric: null, reader: null, claims: [], grades: [], reviewStats: [], publish: null, attachments: [], focus: false, threadOpen: false });
let styleRules = '', feedbackText = '';
let savedTimer, saveTimer, saving = false, dirty = false;
function meta() {
  const all = sections(), n = docWords();
  return { words: n, sections: all.length, ready: all.filter(x => sectionStatus(x.title, x.words) === 'ready').length, open: state.comments.filter(c => !c.resolved).length, updated: Date.now() };
}
function save() {
  if (!state.id) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!state.id || saving) return;
  saving = true; dirty = false;
  try {
    const { attachments, ...rest } = state;
    await store.save(state.id, { ...rest, attachments: attachments.map(a => ({ ...a })), meta: meta() }, toMarkdown());
    const s = $('#saved'); if (s) { s.classList.add('show'); clearTimeout(savedTimer); savedTimer = setTimeout(() => s.classList.remove('show'), 1500); }
  } catch (e) { console.error('save failed', e); }
  saving = false;
  if (dirty) flush();
}
window.addEventListener('beforeunload', () => { if (dirty) flush(); });
let state = blank();
let busy = false;

const $ = s => document.querySelector(s);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const words = t => (t.trim().match(/\S+/g) || []).length;
const uid = () => Math.random().toString(36).slice(2, 9);
const tpl = () => TEMPLATES[state.templateId] || TEMPLATES.design;
let doc = null; // the editor (editor/main.js)
const hintFor = () => ''; // hints live in the section spine, not in the text
const tplSection = t => tpl().sections.find(s => s.title.toLowerCase() === (t || '').trim().toLowerCase());
const tplHint = t => tplSection(t)?.hint || '';
const tplChecks = t => (tplSection(t)?.checks || '').split(/,\s*/).filter(Boolean);
const sections = () => doc ? doc.sections() : [];
const titles = () => [NOTES, ...sections().map(s => s.title)];
const notesBox = () => $('#notes-box');

}
const kindOf = a => KIND_LABEL[a.type] && a.type !== 'draft' ? a.type : 'structure';

/* ---------- talking to the coach ---------- */
function payload() {
  return {
    mode: state.mode, current: state.current, title: state.title, notes: state.notes, audience: state.audience || '', purpose: state.purpose || '', brief: state.brief || {}, style: styleRules || DEFAULT_STYLE,
    attachments: state.attachments.map(a => a.kind === 'image' ? { name: a.name, kind: 'image', mime: a.mime, data: images[a.id] || '' } : { name: a.name, kind: a.kind, text: a.text || '' }).filter(a => a.kind !== 'image' || a.data),
    template: { name: tpl().name, sections: tpl().sections },
    sections: sections().map(({ title, text }) => ({ title, text })),
    history: state.chat.slice(0, -1).filter(m => !m.ui).map(({ role, content }) => ({ role, content })),
    feedback: feedbackText || '',
  };
}
function setBusy(on) { busy = on; $('#send').disabled = on; $('#review-all').disabled = on; $('#coach').classList.toggle('busy', on); doc.refreshCoach(); }
async function send(text, opts = {}) {
  if (busy || !text.trim()) return;
  setBusy(true);
  const section = state.current;
  state.chat.push({ role: 'user', content: text.trim(), hidden: !!opts.hidden, label: opts.label || '' });
  const m = { role: 'assistant', content: '', done: false, verify: !!opts.hidden };
  setThread(true);
  state.chat.push(m);
  renderLog();
  const d = $('#log').lastElementChild, log = $('#log');
  const onText = t => { m.content += t; fillMsg(d, m); log.scrollTop = log.scrollHeight; };
  try {
    if (!window.__TAURI__) { await mockCoach(text, onText); throw null; }
    const { invoke, Channel } = window.__TAURI__.core;
    const onChunk = new Channel();
    onChunk.onmessage = onText;
    await invoke('ask', { body: payload(), onChunk });
  } catch (e) {
    if (e !== null) m.content += `\n\n${e}`;
  }
  if (!m.content.trim()) m.content = 'The coach sent no answer. Please try again.';
  m.done = true;
  const before = state.comments.length;
  m.added = ingest(m.content, section);
  if (m.added) state.lastReview = Date.now();
  // Ground the review: notes that quoted words not in the document go back once for correction.
  const unfound = state.comments.slice(before).filter(c => c.kind !== 'draft' && c.quote && !c.anchored);
  m.unfound = unfound.length;
  fillMsg(d, m);
  setBusy(false);
  save(); renderComments();
  if (m.added) showView('doc');
  if (opts.feedback && m.done) {
    const weights = (m.content.match(/^Weight:.*$/gm) || []).map(x => x.trim());
    if (weights.length) { try { const cur = (await store.feedback.get()) || ''; const next = (cur.trim() + '\n\n' + new Date().toISOString().slice(0, 10) + ' · ' + (state.title || 'Untitled') + '\n' + weights.join('\n')).trim(); await store.feedback.set(next); feedbackText = next; } catch (e) { console.warn(e); } }
  }
  if (!opts.hidden && m.added) {
    const english = state.comments.slice(before).filter(c => c.kind === 'english').length;
    state.reviewStats.push({ at: Date.now(), english, notes: m.added, avg: state.rubric && state.rubric.at > Date.now() - 60000 ? rubricAvg() : null });
    try { await store.history.snapshot(state.id, toMarkdown(), (state.rubric && state.rubric.at > Date.now() - 60000 ? 'rubric-' + rubricAvg().toFixed(1) : 'review')); } catch (e) { console.warn(e); }
    advanceAfter(section);
  }
  if (pendingDiagrams.length) { const list = pendingDiagrams.splice(0); for (const d of list) await placeDiagram(d, opts.drawAt); }
  if (unfound.length && !opts.hidden) {
    state.comments = state.comments.filter(c => !unfound.includes(c));
    const list = unfound.map(c => `- [${c.kind}] quote="${c.quote.replace(/"/g, "'")}" — ${c.body.slice(0, 160)}`).join('\n');
    await send(`These notes quoted words that are not in the document word for word:\n${list}\n\nSend only these notes again as <note> tags, each with 3 to 12 words copied exactly from the document, or drop the note if you cannot find the words. No other text.`, { hidden: true });
  }
}

// Outside the desktop app (plain browser, for UI work) the coach answers with a canned reply that quotes the real text.
async function mockCoach(text, emit) {
  const sec = state.current, body = sectionText(sec).replace(/^\s*([-*+]|\d+\.)\s+/gm, '').replace(/[*_`#>\[\]]/g, '');
  const w = body.split(/\s+/).filter(Boolean);
  const q1 = w.slice(0, 6).join(' '), q2 = w.slice(-4).join(' ');
  const reply = /interview/i.test(text)
    ? `Let us start with the "${sec}" section.\n\nWhen this is done, what will be true that is not true today? One sentence is enough. For example: "No single client can slow down the others."`
    : w.length < 4
      ? `The "${sec}" section is empty, so there is nothing to review yet. Write two or three sentences and I will go through them.\n\n<note type="missing">${hintFor(sec) || 'What should a reader learn from this section?'}</note>`
      : /^Draw this/.test(text)
        ? `Here is the flow as the text describes it.\n\n<diagram title="Clients hit the limiter before the API">{"nodes":[{"id":"c","label":"Clients"},{"id":"l","label":"Rate limiter (Redis)"},{"id":"a","label":"Payments API"}],"edges":[{"from":"c","to":"l","label":"requests"},{"from":"l","to":"a","label":"allowed"}]}</diagram>`
      : /claims in the/.test(text)
        ? `<claim quote="${q1}" source="unsupported">Which clients, and what share of traffic? A dashboard link would settle it.</claim>\n<claim quote="${q2}" source="brief">Matches the known numbers in the brief.</claim>`
      : /Rehearse the review meeting/.test(text)
        ? `**Skeptical VP:** What do I lose if I say no for a quarter? Give me a number.`
      : /^Next question\.$/.test(text) || /quarter/.test(text)
        ? `<grade value="3">You named the cost but not its size.</grade>\n\n**Staff peer:** Why not per-client quotas at the load balancer, which already exists?`
      : /as my reader/.test(text)
        ? `I am the platform team lead. I have ten minutes before the next meeting.\n\n<note type="reader" severity="low" quote="${q1}">Good, I know this problem. I keep reading.</note>\n\n<note type="reader" severity="high" quote="${q2}">Here I stop. How many clients? If it is three, I want their names before I fund a cluster.</note>\n\n<reader decision="ask">I would ask for the client count and the month-end numbers before saying yes; with those, I approve.</reader>`
      : /30-second read/.test(text)
        ? `From the title, first paragraph and headings alone, this document asks for approval to build a rate limiter, from the platform team lead. The brief asks for the same, so a skimming reader gets it right. One gap: the cost is not visible in the first screen.`
      : /as a panel/.test(text)
        ? `Panel verdict first: the ask is clear, the evidence is thin.\n\n<note type="question" severity="high" persona="Skeptical VP">What do I lose if I say no for a quarter?</note>\n\n<note type="missing" severity="medium" persona="Staff peer" quote="${q2}">Why not the simpler option: per-client quotas at the load balancer?</note>\n\n<note type="question" severity="medium" persona="On-call SRE">What wakes me up at 3 a.m., and how do I undo it?</note>\n\n${RUBRIC.map((d, k) => `<score dimension="${d}" value="${[4, 2, 3, 3, 4, 4, 3, 2][k]}">${['Ask is in the first lines.', 'Adjectives where numbers should be.', 'Do-nothing is missing.', 'Risks are named, mitigation is thin.', 'Right vocabulary for the reader.', 'Headings argue.', 'Some restatement.', 'No owner or date.'][k]}</score>`).join('\n')}\n<verdict>REVISE</verdict>\n\nNext: add the do-nothing option with its cost.`
      : /quoted words that are not in the document/.test(text)
        ? `<note type="missing" severity="medium" quote="${w.slice(-3).join(' ')}">How much, and how often? Add one number a reviewer can check.</note>`
        : `This section has the right idea, but a reviewer will need numbers.\n\n<note type="english" severity="medium" quote="${q1}" fix="The Payments API gets too many requests from a few clients" rule="subject-verb agreement">A singular subject takes a singular verb, and "many" takes a plural noun.</note>\n\n<note type="missing" severity="high" quote="${q2} invented words">How much, and how often? Add one number a reviewer can check.</note>\n\n<note type="question" severity="medium">A reviewer will ask: why not just scale up the servers?</note>\n\n<draft section="${sec}">A few clients send bursts of traffic to the Payments API. During these bursts, p99 latency rises from [TODO: X ms] to [TODO: Y ms] for all clients.</draft>\n\n${tplChecks(sec).map((i, k) => `<check section="${sec}" item="${i}" status="${['pass', 'fail', 'partial', 'fail'][k % 4]}">${['Clear enough.', 'Not there yet.', 'Thin: one example, no numbers.', 'Missing.'][k % 4]}</check>`).join('\n')}\n\nNext: get the latency numbers from your dashboard.`;
  await new Promise(r => setTimeout(r, 500));
  for (const piece of reply.match(/[\s\S]{1,24}/g)) { emit(piece); await new Promise(r => setTimeout(r, 10)); }
}

async function importFile(f, templateId) {

/* ---------- diagrams from the coach's spec ---------- */
const pendingDiagrams = [];
// ponytail: layered left-to-right layout, no edge routing; good enough for <=12 boxes.
function layout(spec) {
  const nodes = (spec.nodes || []).slice(0, 12).map(n => ({ id: String(n.id), label: String(n.label || n.id) }));
  const edges = (spec.edges || []).map(e => ({ from: String(e.from), to: String(e.to), label: e.label })).filter(e => nodes.some(n => n.id === e.from) && nodes.some(n => n.id === e.to));
  const depth = {}; nodes.forEach(n => { depth[n.id] = 0; });
  for (let pass = 0; pass < nodes.length; pass++) for (const e of edges) { const d = depth[e.from] + 1; if (d > depth[e.to] && d < nodes.length) depth[e.to] = d; }
  const cols = {}; nodes.forEach(n => { (cols[depth[n.id]] ||= []).push(n); });
  const W = 220, H = 80, GX = 110, GY = 40, pos = {};
  Object.entries(cols).forEach(([c, list]) => list.forEach((n, r) => { pos[n.id] = { x: 40 + Number(c) * (W + GX), y: 40 + r * (H + GY) }; }));
  const els = nodes.map(n => ({ type: 'rectangle', id: 'n-' + n.id, x: pos[n.id].x, y: pos[n.id].y, width: W, height: H, label: { text: n.label } }));
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to], back = b.x <= a.x;
    const x = back ? a.x + W / 2 : a.x + W, y = back ? a.y + H : a.y + H / 2;
    els.push({ type: 'arrow', x, y, width: (back ? b.x + W / 2 : b.x) - x, height: (back ? b.y : b.y + H / 2) - y, start: { id: 'n-' + e.from }, end: { id: 'n-' + e.to }, ...(e.label ? { label: { text: String(e.label) } } : {}) });
  }
  return els;
}
async function placeDiagram(d, at) {
  try { await loadDiagram(); } catch (e) { console.warn(e); return; }
  const r = await window.Diagram.render(window.Diagram.elements(layout(d.spec)));
  let file = null;
  try { if (inApp) file = await store.asset(state.id, `diagram-${Date.now()}.svg`, btoa(unescape(encodeURIComponent(r.svg)))); } catch {}
  if (at != null) doc.editor.commands.setTextSelection(Math.min(at, doc.editor.state.doc.content.size));
  doc.insertDiagram(r.svg, r.scene, file);
  save();
}

async function addFiles(files) {
  for (const f of files) {
    const a = { id: uid(), name: f.name, size: f.size, kind: 'text', text: '', note: '' };
    try {
      if (f.type.startsWith('image/')) {
        if (f.size > 5 * 1048576) throw new Error('Image is over 5 MB.');
        a.kind = 'image'; a.mime = f.type; images[a.id] = await readAs(f, 'base64'); a.note = 'kept for this session only';
      } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
        a.kind = 'pdf';
        if (!window.__TAURI__) throw new Error('PDF text extraction needs the desktop app.');
        a.text = await window.__TAURI__.core.invoke('extract_pdf', { data: await readAs(f, 'base64') });
      } else if (TEXTY.test(f.name) || f.type.startsWith('text/') || !f.type) {
        if (f.size > 2 * 1048576) throw new Error('Text file is over 2 MB.');
        a.text = await readAs(f, 'text');
      } else throw new Error('Unsupported file type.');
    } catch (e) { a.error = String(e.message || e); }
    state.attachments.push(a);
  }

  renderContext();
}

}

const DEMO_MD = `## Context and problem

The Payments API gets too many requests from a few clients at month end. p99 latency rise from 200 ms to 2.1 s for everyone, and the on-call engineer throttles clients by hand. Three incidents in the last quarter were caused by this.

## Goals and non-goals

- No single client can slow down the others.
- p99 stays under 300 ms during the month-end peak.
- Non-goal: billing or quota sales. Limits are an operational control, not a product.

## Proposed design

We propose a per-client token bucket in Redis. Each client gets 500 requests per second, refilled continuously. The limiter sit in the API gateway and answers 429 with a Retry-After header. Limits live in a config map and change without a deploy. If Redis is slow, the limiter fails open so no request is dropped.

## Alternatives considered

- Do nothing: three more incidents a quarter, and the on-call keeps throttling by hand.
- Quotas at the load balancer: cheaper, but it cannot see the client id behind the shared gateway key.
- Scale the API: about $18k a month more, for a peak that lasts two days.

## Open questions
`;
